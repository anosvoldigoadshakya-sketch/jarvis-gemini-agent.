services:
  - type: web
    name: jarvis-gemini-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: JARVIS_WEB_TOKEN
        generateValue: true
      - key: JARVIS_AGENT_TOKEN
        generateValue: true
